openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: listings
    description: Public leaderboard listings
  - name: activity
    description: Public activity feed
  - name: public-marketplace
    description: Account-free sandbox marketplace actions
  - name: campaigns
    description: Weekly public bidding campaigns and permanent winner history
  - name: member
    description: Authenticated member account and listings
  - name: moderation
    description: Moderator controls and trust operations
  - name: storage
    description: Object storage serving endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /listings:
    get:
      operationId: getListings
      tags: [listings]
      summary: Get ranked listings
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [rank, newest, rating, supporters, controversial]
            default: rank
      responses:
        "200":
          description: Ranked listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
  /listings/{slug}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get one listing
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Listing detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDetail"
        "404":
          description: Listing not found
  /campaigns/current:
    get:
      operationId: getCurrentCampaign
      tags: [campaigns]
      summary: Get the server-authoritative live campaign
      responses:
        "200":
          description: Current Sunday-to-Sunday campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCampaign"
  /campaigns/top4:
    get:
      operationId: getTop4Board
      tags: [campaigns]
      summary: Get the homepage TOP 4 board (live rankings or the previous campaign's frozen winners)
      description: Returns the live current-campaign top 4 rankings when no prior campaign has completed yet, or the immediately preceding completed campaign's frozen final top 4 once one exists. The frozen entries never change while the current campaign is live.
      responses:
        "200":
          description: TOP 4 board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Top4Board"
  /analytics/public:
    get:
      operationId: getPublicAnalytics
      tags: [analytics]
      summary: Get public platform proof metrics
      responses:
        "200":
          description: Public analytics totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAnalytics"
  /analytics/visit:
    post:
      operationId: recordAnalyticsVisit
      tags: [analytics]
      summary: Record one anonymous visitor session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsVisitInput"
      responses:
        "204":
          description: Visit recorded or already counted for this session
        "400":
          description: Invalid analytics payload
  /winners:
    get:
      operationId: getCampaignWinners
      tags: [campaigns]
      summary: Get permanent weekly winner history and final standings
      responses:
        "200":
          description: Completed campaign winners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignWinner"
  /listings/{listingId}/click:
    get:
      operationId: clickListingWebsite
      tags: [listings]
      summary: Record a website click and redirect to the destination
      description: Public, unauthenticated endpoint meant for direct browser navigation (an anchor href), not the generated API client. Resolves the listing's canonical website URL server-side, records an anonymous click event, and responds with a redirect. Never accepts a client-supplied destination URL.
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirects to the listing's website
        "404":
          description: Listing not found or has no valid website URL
  /listings/{listingId}/demo-view:
    post:
      operationId: recordDemoView
      tags: [listings]
      summary: Record a demo video view, deduplicated per anonymous visitor
      description: Public, unauthenticated endpoint called when a viewer opens a listing's demo video. Increments the listing's demo view counter at most once per distinct visitor (identified the same way as website-click and site-visit analytics). Returns 404 when the listing has no demo video configured.
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordDemoViewInput"
      responses:
        "200":
          description: Current authoritative demo view count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoViewCount"
        "404":
          description: Listing not found or has no demo video
  /listings/{listingId}/spotlight-impression:
    post:
      operationId: recordSpotlightImpression
      tags: [listings]
      summary: Record a homepage featured-spotlight popup impression
      description: Public, unauthenticated endpoint fired once when the homepage's featured-listing spotlight popup is actually shown to a visitor. Not deduplicated per visitor -- each session-gated popup showing counts as one impression. Requires the listing to exist and be active.
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordSpotlightImpressionInput"
      responses:
        "200":
          description: Impression recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotlightImpressionAck"
        "404":
          description: Listing not found
  /listings/{slug}/support:
    post:
      operationId: supportListing
      tags: [listings]
      summary: Record a sandbox support signal
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalInput"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
  /listings/{slug}/penalize:
    post:
      operationId: penalizeListing
      tags: [listings]
      summary: Record a sandbox penalty signal
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalInput"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
  /public/listings/preview:
    post:
      operationId: previewPublicListing
      tags: [public-marketplace]
      summary: Preview a public sandbox listing
      description: Projects the rank for an account-free listing checkout. This endpoint is sandbox-only and does not create a listing or collect funds. Browser requests must be same-origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicListingPreviewInput"
            example:
              websiteUrl: https://example.com
              ownerBid: 100
      responses:
        "200":
          description: Projected sandbox rank or an existing listing with the same website
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListingPreview"
              examples:
                projection:
                  value:
                    canonicalUrl: https://example.com/
                    rank: 4
                    currentTop: 250
                    toReachTop: 251
                duplicate:
                  value:
                    canonicalUrl: https://example.com/
                    duplicate:
                      $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/SameOriginForbidden"
  /public/campaign-bids:
    post:
      operationId: placeCampaignBid
      tags: [public-marketplace, campaigns]
      summary: Place a new product bid or increase an existing owner bid
      description: Creates a sandbox-verified owner bid in the live campaign. A listed product can only be increased with its original private transaction email; no account is required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignBidInput"
      responses:
        "201":
          description: Verified campaign bid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignBidResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/SameOriginForbidden"
        "409":
          description: The bid does not increase the existing owner bid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /public/listings/checkout:
    post:
      operationId: createPublicListingCheckout
      tags: [public-marketplace]
      summary: Create a public sandbox listing checkout
      description: Creates a listing and completes its opening bid in the server sandbox. No account, card details, or real funds are required. Retrying the same Idempotency-Key is safe; a replay returns 200 with the original result. Browser requests must be same-origin.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicListingCheckoutInput"
            example:
              websiteUrl: https://example.com
              category: SaaS
              name: Example Cloud
              tagline: Simple tools for modern teams
              description: A focused product for teams that want less busywork.
              ownerBid: 100
              email: owner@example.com
              ownerName: Example Founder
      responses:
        "200":
          description: Idempotent replay returned the original public sandbox checkout result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListingCheckoutResponse"
        "201":
          description: Created public sandbox listing and completed checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListingCheckoutResponse"
              example:
                listing:
                  $ref: "#/components/schemas/Listing"
                payment:
                  id: 6c0f53ce-6f6c-4aaf-97f7-4d4e4a2c18a3
                  status: succeeded
                  receiptNumber: SBX-000123
                manageUrl: /manage/secure-management-token
                sandbox: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/SameOriginForbidden"
        "409":
          description: The website is already listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConflictError"
              example:
                error: This website is already on the leaderboard
                duplicate:
                  $ref: "#/components/schemas/Listing"
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/listings/{slug}/checkout:
    post:
      operationId: createPublicActionCheckout
      tags: [public-marketplace]
      summary: Record a public sandbox community signal
      description: Completes an account-free support or penalty checkout against an active listing in the server sandbox. No card details or real funds are required. If checkout confirmation is indeterminate, retry the exact request with the same Idempotency-Key; the retry resumes the original payment attempt. Browser requests must be same-origin.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: example-cloud
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicActionCheckoutInput"
            example:
              type: support
              amount: 25
              email: supporter@example.com
              reason: Great product
      responses:
        "200":
          description: Idempotent replay resumed or returned the original public action checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicActionCheckoutResponse"
        "201":
          description: Completed public sandbox signal checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicActionCheckoutResponse"
              example:
                payment:
                  id: 0e7a8fb7-0fd1-4a44-aab8-765c1f2377d1
                  status: succeeded
                  receiptNumber: SBX-000124
                listing:
                  $ref: "#/components/schemas/Listing"
                sandbox: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/SameOriginForbidden"
        "404":
          description: Active listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Active listing not found
        "409":
          description: The request conflicts with the original idempotent action or the listing is not eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The payment provider rejected the checkout or could not be reached after a stored checkout was confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Checkout outcome is indeterminate; retry the exact request with its original Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Payment checkout creation is pending confirmation; retry using the same Idempotency-Key
                retryable: true
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/payment-environment:
    get:
      operationId: getPublicPaymentEnvironment
      tags: [public-marketplace]
      summary: Read the active public payment environment
      description: Returns whether public checkout is operating in sandbox or live mode. It does not expose payment credentials or provider secrets.
      responses:
        "200":
          description: Active public payment environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentEnvironment"
  /public/payments/{id}:
    get:
      operationId: getPublicPaymentStatus
      tags: [public-marketplace]
      summary: Read the status of a public checkout
      description: Returns the server-authoritative status for the opaque payment ID included in the hosted checkout return URL. It contains no payer details. Rankings only change after the provider verifies payment.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 0e7a8fb7-0fd1-4a44-aab8-765c1f2377d1
      responses:
        "200":
          description: Public payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPaymentReceipt"
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /public/payments/{id}/review:
    post:
      operationId: createPublicReview
      tags: [public-marketplace]
      summary: Submit a review for a public sandbox checkout
      description: Adds one community review to a completed public support or penalty checkout. This endpoint is account-free and sandbox-only. Browser requests must be same-origin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 0e7a8fb7-0fd1-4a44-aab8-765c1f2377d1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicReviewInput"
            example:
              anonymous: true
              rating: 5
              reason: Great product
              body: This was useful for our team.
      responses:
        "201":
          description: Created public review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicReview"
              example:
                id: 2f7eb8c8-fbe6-44b5-87a8-b8c0d6f53b5d
                listingId: 4a7b8b9e-0ebd-4f51-9cb0-39c4de2f2d58
                kind: support
                author: Anonymous Supporter
                rating: 5
                reason: Great product
                body: This was useful for our team.
                createdAt: "2026-08-23T12:00:00.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/SameOriginForbidden"
        "404":
          description: Completed community checkout not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "409":
          description: Review already exists or checkout is not in the ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /public/manage/{token}:
    get:
      operationId: getPublicManagedListing
      tags: [public-marketplace]
      summary: Read a secure public listing management link
      description: Reads a time-limited, revocable management link for an account-free sandbox listing. The token must be treated as a secret.
      parameters:
        - $ref: "#/components/parameters/ManagementToken"
      responses:
        "200":
          description: Managed listing and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicManagedListing"
              example:
                listing:
                  $ref: "#/components/schemas/Listing"
                ownerName: Example Founder
                activity: []
                managementExpiresAt: "2026-11-21T12:00:00.000Z"
        "404":
          description: Management link not found, expired, or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updatePublicManagedListing
      tags: [public-marketplace]
      summary: Update a listing through a secure public management link
      description: Updates account-free sandbox listing details. Owner bids may only increase; an Idempotency-Key is required when increasing the bid. Browser requests must be same-origin.
      parameters:
        - $ref: "#/components/parameters/ManagementToken"
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicManagementUpdateInput"
            example:
              tagline: Simple tools for modern teams
              ownerBid: 150
      responses:
        "200":
          description: Updated public sandbox listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicManagedListingUpdateResponse"
              example:
                listing:
                  $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Same-origin browser request required, or suspended listings cannot be changed through the management link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Management link expired or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Owner bid cannot be reduced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: archivePublicManagedListing
      tags: [public-marketplace]
      summary: Archive a listing through a secure public management link
      description: Archives an account-free sandbox listing and revokes its management link. The token must be treated as a secret. Browser requests must be same-origin.
      parameters:
        - $ref: "#/components/parameters/ManagementToken"
      responses:
        "204":
          description: Listing archived and management link revoked
        "403":
          description: Same-origin browser request required, or suspended listings cannot be archived through the management link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Management link expired or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /public/manage/{token}/logo-upload-url:
    post:
      operationId: requestPublicManagedListingLogoUploadUrl
      tags: [public-marketplace]
      summary: Request a presigned upload URL for a managed listing's logo
      description: Account-free equivalent of the member logo-upload-url endpoint, authorized by the secure management token instead of a session. Browser requests must be same-origin.
      parameters:
        - $ref: "#/components/parameters/ManagementToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoUploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoUploadUrlResponse"
        "400":
          description: Missing or invalid required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Same-origin browser request required, or suspended listings cannot be changed through the management link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Management link expired or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /public/reviews/{id}/vote:
    post:
      operationId: votePublicReview
      tags: [public-marketplace]
      summary: Mark a public review helpful
      description: Records an anonymous, rate-limited helpful vote for a published review. This endpoint is account-free and sandbox-only. Browser requests must be same-origin.
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      responses:
        "200":
          description: Updated anonymous review vote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewVote"
              example:
                reviewId: 2f7eb8c8-fbe6-44b5-87a8-b8c0d6f53b5d
                helpfulCount: 7
                voted: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/SameOriginForbidden"
        "404":
          description: Published review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: removePublicReviewVote
      tags: [public-marketplace]
      summary: Remove an anonymous helpful vote
      description: Removes the current visitor's anonymous helpful vote from a published review. This endpoint is account-free and sandbox-only. Browser requests must be same-origin.
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      responses:
        "200":
          description: Updated anonymous review vote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewVote"
              example:
                reviewId: 2f7eb8c8-fbe6-44b5-87a8-b8c0d6f53b5d
                helpfulCount: 6
                voted: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/SameOriginForbidden"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve an uploaded object (e.g. a listing logo)
      description: Streams binary content for an object uploaded via a logo-upload-url flow. Unauthenticated by default -- logos are public-facing images shown throughout the app.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
          description: Object path within the private object dir (e.g. `uploads/<uuid>`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to serve object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /payments/checkout:
    post:
      operationId: createPaymentCheckout
      tags: [payments]
      summary: Create an idempotent payment checkout
      description: Creates a pending checkout. A payment only affects the ledger after a verified provider event is received. Test-mode checkouts are completed by a server-generated test event.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCheckoutInput"
      responses:
        "201":
          description: Payment checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          description: Invalid checkout or idempotency key
        "401":
          description: Authentication required
        "409":
          description: Idempotency key conflict
        "503":
          description: Live payments are not enabled or configured
  /payments/{id}:
    get:
      operationId: getPayment
      tags: [payments]
      summary: Get one of the authenticated member's payments
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          description: Authentication required
        "403":
          description: Payment is not owned by the member
        "404":
          description: Payment not found
  /payments/{id}/refund:
    post:
      operationId: refundPayment
      tags: [payments]
      summary: Request a refund for an eligible payment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRefundInput"
      responses:
        "200":
          description: Refund and updated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRefundResponse"
        "400":
          description: Invalid refund
        "401":
          description: Authentication required
        "403":
          description: Payment is not owned by the member
        "404":
          description: Payment not found
        "409":
          description: Payment is not refundable or amount exceeds the balance
        "503":
          description: Live refunds are not enabled or configured
  /paypal/create-order:
    post:
      operationId: createPayPalOrder
      tags: [payments]
      summary: Create a PayPal Orders v2 order for a local payment
      description: Authenticated. Accepts only the opaque local payment ID; amount and currency are derived server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayPalCreateOrderInput"
      responses:
        "201": { description: PayPal order created }
  /paypal/capture-order:
    post:
      operationId: capturePayPalOrder
      tags: [payments]
      summary: Capture an approved PayPal order
      description: Authenticated. The server verifies capture status, local order binding, USD currency, and cents before finality.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayPalCaptureOrderInput"
      responses:
        "200": { description: Verified payment result }
  /paypal/webhook:
    post:
      operationId: receivePayPalWebhook
      tags: [payments]
      summary: Receive a verified PayPal webhook
      description: Raw JSON only. The server verifies PayPal transmission headers through PayPal's verify-webhook-signature endpoint.
      responses:
        "202": { description: Event accepted }
        "401": { description: Invalid webhook signature }
  /payments/webhooks/{provider}:
    post:
      operationId: receivePaymentWebhook
      tags: [payments]
      summary: Receive a signed provider payment event
      description: Provider events must include a valid HMAC signature. Replayed event IDs are acknowledged without applying a second ledger mutation.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: x-payment-signature
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderWebhookPayload"
      responses:
        "200":
          description: Event accepted and reconciled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentWebhookResponse"
        "400":
          description: Invalid or unsupported event
        "401":
          description: Invalid webhook signature
        "404":
          description: Payment not found
