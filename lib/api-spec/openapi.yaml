components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A stable key for safely retrying the same payment operation.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: A stable key for safely retrying a sandbox owner-bid increase.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ManagementToken:
      name: token
      in: path
      required: true
      description: Secret, time-limited token from a public sandbox listing checkout.
      schema:
        type: string
        minLength: 32
        maxLength: 255
    ReviewId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Invalid request
    SameOriginForbidden:
      description: The request did not include a matching same-origin Origin header.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingOrigin:
              value:
                error: Same-origin requests are required
            crossOrigin:
              value:
                error: Cross-origin requests are not allowed
    RateLimited:
      description: The anonymous action rate limit has been reached.
      headers:
        Retry-After:
          description: Seconds until the current action window resets.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Rate limit reached. Try again later.
  schemas:
    PayPalCreateOrderInput:
      type: object
      required: [paymentId]
      properties:
        paymentId: { type: string }
    PayPalCaptureOrderInput:
      type: object
      required: [paymentId, orderId]
      properties:
        paymentId: { type: string }
        orderId: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
        retryable:
          type: boolean
          description: Whether retrying the same idempotent request is safe and appropriate.
      required: [error]
    CampaignListing:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        initials: { type: string }
        accent: { type: string }
        websiteUrl:
          type: string
          nullable: true
          description: Optional; only populated by endpoints that need to link out to the product's site.
        demoVideoUrl:
          type: string
          nullable: true
          description: Optional demo video URL; when present, listing cards show a compact Demo button (no view count here).
        logoUrl:
          type: ["string", "null"]
          description: Owner-uploaded brand logo path, when one has been uploaded.
      required: [id, name, slug, initials, accent, logoUrl]
    CampaignStanding:
      type: object
      properties:
        rank: { type: number, minimum: 1 }
        effectiveBid: { type: number }
        ownerBid: { type: number, description: "The listing owner's own bid, before community boosts/penalties. effectiveBid minus this is the net community boost currently applied." }
        listing: { $ref: "#/components/schemas/CampaignListing" }
      required: [rank, effectiveBid, ownerBid, listing]
    CampaignWinner:
      type: object
      properties:
        campaignNumber: { type: number, minimum: 1 }
        startAt: { type: string }
        endAt: { type: string }
        declaredAt: { type: string }
        finalEffectiveBid: { type: number }
        listing:
          allOf:
            - $ref: "#/components/schemas/CampaignListing"
            - type: object
              properties:
                category: { type: string }
              required: [category]
        finalRankings:
          type: array
          items: { $ref: "#/components/schemas/CampaignStanding" }
      required: [campaignNumber, startAt, endAt, declaredAt, finalEffectiveBid, listing, finalRankings]
    Top4Board:
      type: object
      properties:
        mode:
          type: string
          enum: [live, final]
          description: "live: no prior campaign has completed, so these are the current campaign's dynamic rankings. final: these are the previous completed campaign's frozen final standings."
        campaignNumber:
          type: number
          description: The campaign these entries belong to (the current live campaign when mode is live, or the completed campaign when mode is final).
        entries:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/CampaignStanding" }
      required: [mode, campaignNumber, entries]
    CurrentCampaign:
      type: object
      properties:
        id: { type: string }
        number: { type: number, minimum: 1 }
        status: { type: string, enum: [live, completed] }
        startAt: { type: string }
        endAt: { type: string }
        minimumBid: { type: number, minimum: 1 }
        timezone: { type: string, const: UTC }
        lastWinner:
          type: ["object", "null"]
          properties:
            campaignNumber: { type: number, minimum: 1 }
            name: { type: string }
            slug: { type: string }
            initials: { type: string }
            accent: { type: string }
            effectiveBid: { type: number }
          required: [campaignNumber, name, slug, initials, accent, effectiveBid]
      required: [id, number, status, startAt, endAt, minimumBid, timezone, lastWinner]
    AnalyticsVisitInput:
      type: object
      properties:
        visitorId:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        sessionId:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        path:
          type: string
          maxLength: 200
      required: [visitorId, sessionId, path]
    PublicAnalytics:
      type: object
      properties:
        totalVisits: { type: number, minimum: 0 }
        uniqueVisitors: { type: number, minimum: 0 }
        activeProducts: { type: number, minimum: 0 }
        totalBidVolume: { type: number, minimum: 0 }
        ownerClaimVolume: { type: number, minimum: 0 }
        communityBoostVolume: { type: number, minimum: 0 }
        totalBoosts: { type: number, minimum: 0 }
        totalPushDowns: { type: number, minimum: 0 }
        totalReviews: { type: number, minimum: 0 }
        completedCampaigns: { type: number, minimum: 0 }
      required: [totalVisits, uniqueVisitors, activeProducts, totalBidVolume, ownerClaimVolume, communityBoostVolume, totalBoosts, totalPushDowns, totalReviews, completedCampaigns]
    PublicListingPreviewInput:
      type: object
      properties:
        websiteUrl:
          type: string
          pattern: '^(?:https?://)?[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?(?::(?:[0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(?:[/?#][^\s]*)?$'
          maxLength: 2048
          description: Valid website domain or http/https URL.
        ownerBid: { type: number, minimum: 5, maximum: 100000, multipleOf: 1 }
      required: [websiteUrl, ownerBid]
    PublicListingPreview:
      type: object
      properties:
        canonicalUrl: { type: string }
        rank: { type: number }
        currentTop: { type: number }
        toReachTop: { type: number }
        duplicate: { $ref: "#/components/schemas/Listing" }
      required: [canonicalUrl]
    CampaignBidInput:
      type: object
      properties:
        websiteUrl:
          type: string
          pattern: '^(?:https?://)?[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?(?::(?:[0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(?:[/?#][^\s]*)?$'
          maxLength: 2048
        category: { type: string, minLength: 1, maxLength: 80 }
        ownerBid: { type: number, minimum: 5, maximum: 100000, multipleOf: 1 }
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          maxLength: 320
        ownerName: { type: string, minLength: 2, maxLength: 80 }
        demoVideoUrl:
          type: string
          pattern: '^(?:https?://)?[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?(?::(?:[0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(?:[/?#][^\s]*)?$'
          maxLength: 2048
          description: Optional demo video URL (YouTube, YouTube Shorts, Vimeo, or another http(s) link).
        accent:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Optional brand accent color as a 6-digit hex value (e.g. #FF7A5C). When omitted, one is auto-assigned.
      required: [websiteUrl, category, ownerBid, email]
    CampaignBidResponse:
      type: object
      properties:
        mode: { type: string, enum: [new, increase] }
        campaign:
          type: object
          properties:
            number: { type: number, minimum: 1 }
            minimumBid: { type: number, minimum: 1 }
            startAt: { type: string }
            endAt: { type: string }
          required: [number, minimumBid, startAt, endAt]
        listing: { $ref: "#/components/schemas/Listing" }
        payment: { $ref: "#/components/schemas/PublicPaymentReceipt" }
        manageUrl: { type: string }
      required: [mode, campaign, listing, payment]
    PublicListingCheckoutInput:
      type: object
      properties:
        websiteUrl:
          type: string
          pattern: '^(?:https?://)?[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?(?::(?:[0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(?:[/?#][^\s]*)?$'
          maxLength: 2048
          description: Valid website domain or http/https URL.
        category: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 80 }
        tagline: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        ownerBid: { type: number, minimum: 5, maximum: 100000, multipleOf: 1 }
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          maxLength: 320
          description: Valid email address used only for the sandbox record.
        ownerName: { type: string, maxLength: 80 }
      required: [websiteUrl, category, name, tagline, description, ownerBid, email]
    PublicPaymentReceipt:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, succeeded, failed, refunded, partially_refunded, requires_reconciliation] }
        receiptNumber: { type: ["string", "null"] }
        environment:
          type: string
          enum: [sandbox, live]
          description: Environment that created this checkout.
        checkoutUrl:
          type: ["string", "null"]
          description: Hosted provider checkout URL when an external checkout is pending.
      required: [id, status, receiptNumber, environment]
    PaymentEnvironment:
      type: object
      properties:
        mode: { type: string, enum: [sandbox, live] }
        provider: { type: string }
        liveEnabled: { type: boolean }
        paypalClientId:
          type: ["string", "null"]
          description: PayPal JavaScript SDK client ID; never includes a secret.
      required: [mode, provider, liveEnabled]
    PublicListingCheckoutResponse:
      type: object
      properties:
        listing: { $ref: "#/components/schemas/Listing" }
        payment: { $ref: "#/components/schemas/PublicPaymentReceipt" }
        manageUrl: { type: string, minLength: 1 }
        sandbox: { type: boolean, description: Whether this checkout used the sandbox environment. }
      required: [listing, payment, manageUrl, sandbox]
    PublicActionCheckoutInput:
      type: object
      properties:
        type: { type: string, enum: [support, penalty] }
        amount: { type: number, minimum: 5, maximum: 10000, multipleOf: 1 }
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          maxLength: 320
          description: Valid email address used only for the sandbox record.
        reason:
          type: string
          maxLength: 120
          description: A free-form boost reason, or the selected Push Down reason.
        reasonDescription:
          type: string
          maxLength: 120
          description: Optional issue detail for Bug, UI / UX, Performance, or Missing / broken feature; required for Other.
      required: [type, amount, email]
    PublicActionCheckoutResponse:
      type: object
      properties:
        payment: { $ref: "#/components/schemas/PublicPaymentReceipt" }
        listing: { $ref: "#/components/schemas/Listing" }
        sandbox: { type: boolean, description: Whether this checkout used the sandbox environment. }
      required: [payment, listing, sandbox]
    PublicReviewInput:
      type: object
      properties:
        anonymous: { type: boolean, default: true }
        displayName: { type: string, minLength: 2, maxLength: 80 }
        rating: { type: number, minimum: 1, maximum: 5, multipleOf: 1, default: 5 }
        reason: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, maxLength: 1000, default: "" }
      required: [reason]
    PublicReview:
      type: object
      properties:
        id: { type: string }
        listingId: { type: string }
        kind: { type: string, enum: [support, penalty] }
        author: { type: string }
        rating: { type: number, minimum: 1, maximum: 5 }
        reason: { type: string }
        body: { type: string }
        createdAt: { type: string }
      required: [id, listingId, kind, author, rating, reason, body, createdAt]
    PublicManagedActivity:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [OWNER_BID, COMMUNITY_BID, PENALTY, REFUND] }
        amount: { type: number }
        createdAt: { type: string }
        reason: { type: ["string", "null"] }
      required: [id, type, amount, createdAt, reason]
    PublicManagedListing:
      type: object
      properties:
        listing: { $ref: "#/components/schemas/Listing" }
        ownerName: { type: ["string", "null"] }
        activity:
          type: array
          items: { $ref: "#/components/schemas/PublicManagedActivity" }
        managementExpiresAt: { type: ["string", "null"] }
      required: [listing, ownerName, activity, managementExpiresAt]
    PublicManagementUpdateInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        tagline: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        category: { type: string, minLength: 1, maxLength: 80 }
        websiteUrl:
          type: ["string", "null"]
          pattern: '^(?:https?://)?[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?(?::(?:[0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(?:[/?#][^\s]*)?$'
          maxLength: 2048
          description: Valid website domain or http/https URL when provided.
        ownerBid: { type: number, minimum: 5, maximum: 100000, multipleOf: 1 }
        demoVideoUrl:
          type: ["string", "null"]
          pattern: '^(?:https?://)?[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?(?::(?:[0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(?:[/?#][^\s]*)?$'
          maxLength: 2048
          description: Optional demo video URL when provided; set to null to remove an existing one.
        logoUrl:
          type: ["string", "null"]
          pattern: '^/objects/.+$'
          maxLength: 500
          description: Object-storage path returned by the logo-upload-url flow. Set to null to remove the uploaded logo and revert to the initials avatar.
    PublicManagedListingUpdateResponse:
      type: object
      properties:
        listing: { $ref: "#/components/schemas/Listing" }
      required: [listing]
    PublicConflictError:
      type: object
      properties:
        error: { type: string }
        duplicate: { $ref: "#/components/schemas/Listing" }
      required: [error]
    PaymentCheckoutInput:
      type: object
      properties:
        listingId: { type: string, minLength: 1 }
        type:
          type: string
          enum: [OWNER_BID, COMMUNITY_BID, PENALTY]
        amount: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        currency: { type: string, minLength: 3, maxLength: 3, default: USD }
        reason: { type: string, maxLength: 120 }
        receiptEmail: { type: ["string", "null"], maxLength: 320 }
      required: [listingId, type, amount]
    PaymentRefundInput:
      type: object
      properties:
        amount: { type: number, exclusiveMinimum: 0, maximum: 100000 }
        reason: { type: string, maxLength: 500 }
      required: [amount]
    Payment:
      type: object
      properties:
        id: { type: string }
        listingId:
          type: ["string", "null"]
          description: Null until a deferred new-listing checkout's payment succeeds and its listing is created.
        type: { type: string, enum: [OWNER_BID, COMMUNITY_BID, PENALTY, SPONSORSHIP] }
        amount: { type: number }
        currency: { type: string }
        platformFee: { type: number }
        provider: { type: string }
        status:
          type: string
          enum: [pending, succeeded, failed, refunded, partially_refunded, requires_reconciliation]
        providerCheckoutId: { type: ["string", "null"] }
        providerPaymentId: { type: ["string", "null"] }
        failureCode: { type: ["string", "null"] }
        failureMessage: { type: ["string", "null"] }
        receiptNumber: { type: ["string", "null"] }
        receiptEmail: { type: ["string", "null"] }
        checkoutUrl:
          type: ["string", "null"]
          description: Hosted provider sandbox checkout URL when an external checkout is pending.
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, listingId, type, amount, currency, platformFee, provider, status, providerCheckoutId, providerPaymentId, failureCode, failureMessage, receiptNumber, receiptEmail, createdAt, updatedAt]
    PaymentRefund:
      type: object
      properties:
        id: { type: string }
        paymentId: { type: string }
        amount: { type: number }
        reason: { type: ["string", "null"] }
        status: { type: string, enum: [pending, succeeded, failed] }
        providerRefundId: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, paymentId, amount, reason, status, providerRefundId, createdAt]
    PaymentRefundResponse:
      type: object
      properties:
        refund: { $ref: "#/components/schemas/PaymentRefund" }
        payment: { $ref: "#/components/schemas/Payment" }
      required: [refund, payment]
    PaymentWebhookResponse:
      type: object
      properties:
        eventId: { type: string }
        duplicate: { type: boolean }
        handled: { type: boolean }
        payment: { $ref: "#/components/schemas/Payment" }
      required: [eventId, duplicate, handled, payment]
    ProviderWebhookPayload:
      type: object
      description: Provider-specific signed event payload.
      additionalProperties: true
    PaymentReconciliation:
      type: object
      properties:
        markedForReview: { type: number }
        pending: { type: number }
        failed: { type: number }
        succeeded: { type: number }
      required: [markedForReview, pending, failed, succeeded]
    ReportInput:
      type: object
      properties:
        targetType:
          type: string
          enum: [listing, review, transaction, user]
        targetId: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1, maxLength: 120 }
        details: { type: string, maxLength: 1000 }
      required: [targetType, targetId, reason]
    ModerationStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [active, suspended]
        reason: { type: string, maxLength: 500 }
      required: [status]
    ListingModerationInput:
      type: object
      properties:
        moderationStatus:
          type: string
          enum: [active, pending_review, flagged, suspended, removed]
        reason: { type: string, maxLength: 500 }
      required: [moderationStatus]
    Policy:
      type: object
      properties:
        policyType: { type: string }
        title: { type: string }
        content: { type: string }
        version: { type: number }
        publishedAt: { type: ["string", "null"] }
      required: [policyType, title, content, version, publishedAt]
    AdminPolicy:
      allOf:
        - $ref: "#/components/schemas/Policy"
        - type: object
          properties:
            status: { type: string, enum: [draft, published] }
            updatedById: { type: ["string", "null"] }
            updatedAt: { type: string }
          required: [status, updatedById, updatedAt]
    PolicyUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, minLength: 1, maxLength: 200000 }
        status:
          type: string
          enum: [draft, published]
      required: [title, content]
    SiteSettings:
      type: object
      properties:
        businessName: { type: ["string", "null"] }
        businessAddress: { type: ["string", "null"] }
        supportEmail: { type: ["string", "null"] }
        grievanceOfficerName: { type: ["string", "null"] }
        grievanceOfficerEmail: { type: ["string", "null"] }
        invoiceAdminEmail: { type: ["string", "null"] }
        # A configured tax rate is what turns on the tax breakdown on newly
        # issued invoices -- see taxRatePercent on SiteSettingsUpdate. Null
        # means "no tax configured", not "0% tax".
        taxRatePercent: { type: ["number", "null"] }
        taxRegistrationNumber: { type: ["string", "null"] }
        # Defaults to "Tax" when null -- lets a business call this "VAT",
        # "GST", etc. to match what their region's invoices must say.
        taxLabel: { type: ["string", "null"] }
        # Null means "not configured" -- the Featured/Sponsored checkout
        # falls back to a built-in default price/duration, it is never
        # blocked on an admin having visited Site Settings first.
        sponsorshipPriceCents: { type: ["number", "null"] }
        sponsorshipDurationDays: { type: ["number", "null"] }
      required: [businessName, businessAddress, supportEmail, grievanceOfficerName, grievanceOfficerEmail, invoiceAdminEmail, taxRatePercent, taxRegistrationNumber, taxLabel, sponsorshipPriceCents, sponsorshipDurationDays]
    SiteSettingsUpdate:
      type: object
      properties:
        businessName: { type: ["string", "null"], maxLength: 200 }
        businessAddress: { type: ["string", "null"], maxLength: 500 }
        supportEmail: { type: ["string", "null"], maxLength: 200 }
        grievanceOfficerName: { type: ["string", "null"], maxLength: 200 }
        grievanceOfficerEmail: { type: ["string", "null"], maxLength: 200 }
        invoiceAdminEmail: { type: ["string", "null"], maxLength: 200 }
        taxRatePercent: { type: ["number", "null"], minimum: 0, maximum: 100, multipleOf: 0.01 }
        taxRegistrationNumber: { type: ["string", "null"], maxLength: 100 }
        taxLabel: { type: ["string", "null"], maxLength: 40 }
        sponsorshipPriceCents: { type: ["number", "null"], minimum: 100, maximum: 10000000, multipleOf: 1 }
        sponsorshipDurationDays: { type: ["number", "null"], minimum: 1, maximum: 90, multipleOf: 1 }
    PolicyAcceptanceInput:
      type: object
      properties:
        policyType:
          type: string
          enum: [terms, privacy, website_policy, refund_policy, community_guidelines]
        context:
          type: string
          enum: [listing_submission, campaign_claim, payment, signup]
      required: [policyType, context]
    PolicyAcceptance:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        policyType: { type: string }
        policyVersion: { type: number }
        context: { type: string }
        createdAt: { type: string }
      required: [id, userId, policyType, policyVersion, context, createdAt]
    AdminUserRoleInput:
      type: object
      properties:
        role:
          type: string
          enum: [member, moderator]
      required: [role]
    ReviewModerationInput:
      type: object
      properties:
        status:
          type: string
          enum: [published, under_review, hidden]
        reason: { type: string, maxLength: 500 }
      required: [status]
    ReportResolutionInput:
      type: object
      properties:
        status:
          type: string
          enum: [open, under_review, resolved, dismissed]
        resolution: { type: string, maxLength: 500 }
      required: [status]
    FeedbackInput:
      type: object
      properties:
        category:
          type: string
          enum: [payment_issue, bug, other]
        message: { type: string, minLength: 1, maxLength: 2000 }
        contactEmail:
          type: string
          maxLength: 200
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
        path: { type: string, maxLength: 300 }
      required: [category, message]
    FeedbackResolutionInput:
      type: object
      properties:
        status:
          type: string
          enum: [open, resolved, dismissed]
        resolution: { type: string, maxLength: 500 }
      required: [status]
    RateLimitInput:
      type: object
      properties:
        maxRequests: { type: number, minimum: 1, maximum: 10000 }
        windowSeconds: { type: number, minimum: 1, maximum: 86400 }
      required: [maxRequests, windowSeconds]
    RecordDemoViewInput:
      type: object
      properties:
        visitorId:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    DemoViewCount:
      type: object
      properties:
        demoViews: { type: number, minimum: 0 }
      required: [demoViews]
    RecordSpotlightImpressionInput:
      type: object
      properties:
        visitorId:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    SpotlightImpressionAck:
      type: object
      properties:
        recorded: { type: boolean }
      required: [recorded]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SignalInput:
      type: object
      properties:
        amount:
          type: number
          minimum: 1
          maximum: 10000
        reason:
          type: string
          maxLength: 120
      required: [amount]
    ListingInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        tagline: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        category: { type: string, minLength: 1, maxLength: 80 }
        websiteUrl: { type: ["string", "null"], maxLength: 500 }
        ownerBid: { type: number, minimum: 0, maximum: 100000 }
        accent:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Optional brand accent color as a 6-digit hex value (e.g. #FF7A5C). When omitted, one is auto-assigned.
        demoVideoUrl:
          type: ["string", "null"]
          pattern: '^(?:https?://)?[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?(?::(?:[0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(?:[/?#][^\s]*)?$'
          maxLength: 2048
          description: Optional demo video URL (YouTube, YouTube Shorts, Vimeo, or another http(s) link).
      required: [name, tagline, description, category, ownerBid]
    ListingUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        tagline: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        category: { type: string, minLength: 1, maxLength: 80 }
        websiteUrl: { type: ["string", "null"], maxLength: 500 }
        ownerBid: { type: number, minimum: 0, maximum: 100000 }
        status: { type: string, enum: [active, archived] }
        accent:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Brand accent color as a 6-digit hex value (e.g. #FF7A5C).
        demoVideoUrl:
          type: ["string", "null"]
          pattern: '^(?:https?://)?[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?(?::(?:[0-9]{1,4}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(?:[/?#][^\s]*)?$'
          maxLength: 2048
          description: Optional demo video URL when provided; set to null to remove an existing one.
        logoUrl:
          type: ["string", "null"]
          pattern: '^/objects/.+$'
          maxLength: 500
          description: Object-storage path returned by the logo-upload-url flow (e.g. `/objects/uploads/<uuid>`). Set to null to remove the uploaded logo and revert to the initials avatar.
    Listing:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        tagline: { type: string }
        description: { type: string }
        category: { type: string }
        initials: { type: string }
        accent: { type: string }
        rank: { type: number }
        effectiveBid: { type: number }
        ownerBid: { type: number }
        communitySupport: { type: number }
        penalties: { type: number }
        supporters: { type: number }
        penalizers: { type: number }
        rating: { type: number }
        reviewCount: { type: number }
        clicks: { type: number }
        clickAnalytics: { $ref: "#/components/schemas/ListingClickAnalytics" }
        createdAt: { type: string }
        trend: { type: number }
        websiteUrl: { type: ["string", "null"] }
        demoVideoUrl:
          type: ["string", "null"]
          description: Optional demo video URL (YouTube, YouTube Shorts, Vimeo, or another http(s) link).
        demoViewCount:
          type: number
          minimum: 0
          description: Count of distinct visitors who have opened this listing's demo video. Always 0 when demoVideoUrl is null.
        logoUrl:
          type: ["string", "null"]
          description: Owner-uploaded brand logo, served from object storage (e.g. `/objects/uploads/<uuid>`). When null, clients should fall back to the initials/accent avatar.
      required:
        - id
        - name
        - slug
        - tagline
        - description
        - category
        - initials
        - accent
        - rank
        - effectiveBid
        - ownerBid
        - communitySupport
        - penalties
        - supporters
        - penalizers
        - rating
        - reviewCount
        - clicks
        - clickAnalytics
        - createdAt
        - trend
        - websiteUrl
        - demoVideoUrl
        - demoViewCount
        - logoUrl
    ListingClickAnalytics:
      type: object
      description: Website click totals for a listing. uniqueClicks counts distinct anonymous visitors; totalClicks counts every recorded click event.
      properties:
        totalClicks: { type: number }
        uniqueClicks: { type: number }
      required:
        - totalClicks
        - uniqueClicks
    LogoUploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Original file name.
        size:
          type: number
          minimum: 1
          maximum: 5242880
          multipleOf: 1
          description: File size in bytes (max 5MB).
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/webp, image/svg+xml]
          description: MIME type of the logo image.
    LogoUploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Presigned GCS URL for the direct PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/<uuid>`). Pass this back as `logoUrl` on the listing update endpoint.
    MemberListing:
      allOf:
        - $ref: "#/components/schemas/Listing"
        - type: object
          properties:
            ownerId: { type: string }
            status: { type: string, enum: [active, archived] }
            feedback:
              type: array
              items:
                $ref: "#/components/schemas/Review"
          required: [ownerId, status, feedback]
    MemberProfile:
      type: object
      properties:
        id: { type: string }
        email: { type: ["string", "null"] }
        displayName: { type: string }
        photoUrl: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        company: { type: ["string", "null"] }
        profileRole: { type: ["string", "null"] }
        socialLinks: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        role: { type: string, enum: [member, moderator, admin] }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string }
        updatedAt: { type: string }
        listingsCount: { type: number }
        transactionsCount: { type: number }
      required: [id, email, displayName, photoUrl, bio, company, profileRole, socialLinks, website, location, role, status, createdAt, updatedAt, listingsCount, transactionsCount]
    MemberProfileUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 2, maxLength: 80 }
        photoUrl: { type: ["string", "null"], maxLength: 2048 }
        bio: { type: ["string", "null"], maxLength: 1000 }
        company: { type: ["string", "null"], maxLength: 120 }
        profileRole: { type: ["string", "null"], maxLength: 120 }
        socialLinks: { type: ["string", "null"], maxLength: 2000 }
        website: { type: ["string", "null"], maxLength: 2048 }
        location: { type: ["string", "null"], maxLength: 120 }
      required: [displayName]
    Invoice:
      type: object
      properties:
        id: { type: string }
        invoiceNumber: { type: string }
        paymentId: { type: string }
        listingId: { type: ["string", "null"] }
        listingName: { type: ["string", "null"] }
        listingWebsiteUrl: { type: ["string", "null"] }
        campaignNumber: { type: ["number", "null"] }
        type: { type: string, enum: [OWNER_BID, COMMUNITY_BID, PENALTY, SPONSORSHIP] }
        status: { type: string, enum: [PAID, REFUNDED, PARTIALLY_REFUNDED] }
        currency: { type: string }
        subtotal: { type: number }
