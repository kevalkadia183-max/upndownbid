            owner:
              type: ["object", "null"]
              description: Public-safe profile details for this listing's registered owner. Null when the listing has no linked member account. Never includes email, role/status, or other account-internal fields.
              properties:
                displayName: { type: string }
                photoUrl: { type: ["string", "null"] }
                bio: { type: ["string", "null"] }
                company: { type: ["string", "null"] }
                profileRole: { type: ["string", "null"] }
                socialLinks: { type: ["string", "null"] }
