    post:
      operationId: reconcilePayments
      tags: [moderation]
      summary: Reconcile stale payment states
      description: Marks pending checkouts older than fifteen minutes for manual provider reconciliation. It never fabricates a successful payment.
      responses:
        "200":
          description: Reconciliation report
          content:
            application/json:
              schema:
