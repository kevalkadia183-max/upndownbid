        billingName: { type: ["string", "null"] }
        billingEmail: { type: ["string", "null"] }
        provider: { type: string }
        reason: { type: ["string", "null"] }
        pdfAvailable: { type: boolean }
        issuedAt: { type: string }
      required: [id, invoiceNumber, paymentId, listingId, listingName, listingWebsiteUrl, campaignNumber, type, status, currency, subtotal, tax, platformFee, total, refunded, billingName, billingEmail, provider, reason, pdfAvailable, issuedAt]
    MemberTransaction:
      type: object
      properties:
