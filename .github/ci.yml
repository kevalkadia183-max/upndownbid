name: Delivery checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  delivery-checks:
    name: Security and type checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d workspace"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workspace
      SESSION_SECRET: ci-only-session-secret-do-not-use-in-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record shared development schema
        run: ./scripts/node_modules/.bin/tsx artifacts/api-server/test-security.mjs --schema-snapshot "$RUNNER_TEMP/signalrank-shared-schema.json"

      - name: Record shared development data fingerprint
        run: ./scripts/node_modules/.bin/tsx artifacts/api-server/test-security.mjs --data-snapshot "$RUNNER_TEMP/signalrank-shared-data.json"

      - name: Run API security tests
        run: pnpm --filter @workspace/api-server run test

      - name: Verify shared development schema is unchanged
        if: always()
        run: ./scripts/node_modules/.bin/tsx artifacts/api-server/test-security.mjs --verify-schema-snapshot "$RUNNER_TEMP/signalrank-shared-schema.json"

      - name: Verify shared development data is unchanged
        if: always()
        run: ./scripts/node_modules/.bin/tsx artifacts/api-server/test-security.mjs --verify-data-snapshot "$RUNNER_TEMP/signalrank-shared-data.json"

      - name: Verify security-test interruption cleanup
        run: pnpm --filter @workspace/api-server run test:cleanup

      - name: Run workspace typecheck
        run: pnpm run typecheck
